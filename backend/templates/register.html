<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - COD Champions Cup</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        .register-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: brightness(0.4);
            padding: 20px;
        }

        .register-box {
            background: rgba(0, 0, 0, 0.85);
            padding: 35px 45px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #f97316;
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.5);
            backdrop-filter: blur(10px);
        }

        .register-box h2 {
            margin-bottom: 25px;
            color: #f97316;
            font-size: 32px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px #f97316;
            text-transform: uppercase;
        }

        .input-group {
            margin: 15px 0;
            text-align: left;
            color: #fff;
        }

        .input-group label {
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ccc;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #111;
            color: white;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #f97316;
            box-shadow: 0 0 8px rgba(249, 115, 22, 0.4);
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        .register-btn,
        .home-btn {
            width: 100%;
            padding: 14px;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }

        .register-btn {
            background: #f97316;
        }

        .register-btn:hover {
            background: #fb923c;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
            transform: translateY(-2px);
        }

        .home-btn {
            background: transparent;
            border: 1px solid #f97316;
            color: #f97316;
        }

        .home-btn:hover {
            background: rgba(249, 115, 22, 0.1);
        }

        .login-container-link {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #888;
            font-size: 14px;
        }

        .login-link {
            color: #f97316;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .flash-messages {
            margin-bottom: 20px;
        }

        .flash-msg {
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }

        .flash-danger,
        .flash-error {
            background: rgba(249, 115, 22, 0.2);
            color: #fb923c;
            border: 1px solid #f97316;
        }

        .flash-success {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
    </style>
</head>

<body style="background: url('{{ url_for('static', filename='logo.jpg') }}') center/cover no-repeat fixed;">

    <div class="register-container">
        <div class="register-box">
            <h2>Sign Up</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                <div class="flash-msg flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('register') }}">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Choose a username" required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create a password" required>
                </div>

                <div class="btn-container">
                    <button class="register-btn" type="submit">Sign Up</button>
                    <a href="/" class="home-btn" style="text-align: center;">Back to Home</a>
                </div>
            </form>

            <div class="login-container-link">
                Already enrolled? <a href="{{ url_for('login') }}" class="login-link">Sign In</a>
            </div>
        </div>
    </div>

</body>

</html>
