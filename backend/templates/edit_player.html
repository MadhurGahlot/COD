{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-slate-900 p-8 rounded-2xl shadow-2xl border border-slate-800">
    <h1 class="text-3xl mb-6 text-brand">Edit Player Profile</h1>
    <form method="POST" enctype="multipart/form-data">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label class="block text-slate-400 mb-2">Player Name</label>
                <input type="text" name="player_name" value="{{ player.player_name }}" required
                    class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg focus:outline-none focus:border-brand">
            </div>
            <div>
                <label class="block text-slate-400 mb-2">COD Name</label>
                <input type="text" name="cod_name" value="{{ player.cod_name }}" required
                    class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg focus:outline-none focus:border-brand">
            </div>
        </div>
        <div class="mb-6">
            <label class="block text-slate-400 mb-2">Team</label>
            <select name="team_id"
                class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg focus:outline-none focus:border-brand">
                <option value="">None</option>
                {% for team in teams %}
                <option value="{{ team.id }}" {{ 'selected' if player.team_id==team.id }}>{{ team.team_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-6">
            <label class="block text-slate-400 mb-2">Change Photo</label>
            <input type="file" name="photo" class="w-full text-slate-400">
        </div>
        <div class="flex gap-4">
            <button type="submit"
                class="bg-brand hover:bg-brand/90 text-white font-bold px-8 py-3 rounded-lg transition-all">
                Update Profile
            </button>
            <a href="{{ url_for('admin_players') }}"
                class="border border-slate-700 hover:bg-slate-800 px-8 py-3 rounded-lg font-bold">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
