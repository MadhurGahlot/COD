<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ team.team_name }} — Team</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Inter', sans-serif;
            --font-display: 'Oswald', sans-serif;
        }

        body {
            @apply bg-slate-950 text-slate-200 font-sans antialiased min-h-screen;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #020617 70%);
        }

        h1 {
            @apply font-display uppercase tracking-wider;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="w-full flex items-center gap-4 px-6 py-4
            border-b border-white/5 bg-slate-950/60 backdrop-blur-md
            sticky top-0 z-50">

    <!-- BACK TO TEAMS -->
    <a href="/teams"
       class="p-2 rounded-full bg-slate-800 text-slate-400
              hover:bg-indigo-600 hover:text-white transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
    </a>

    <span class="font-display font-bold text-white text-lg">
        {{ team.team_name }}
    </span>
</nav>

<!-- PAGE HEADER -->
<section class="text-center mt-20 mb-16 px-6">
    <h1 class="text-4xl md:text-6xl font-black text-white mb-3 drop-shadow-lg">
        {{ team.team_name }}
    </h1>
    <p class="text-slate-400 uppercase tracking-widest text-sm font-semibold">
        Team Roster
    </p>
</section>

<!-- PLAYERS GRID -->
<section class="max-w-7xl mx-auto px-6 pb-24">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">

        {% for p in players %}
        <div onclick="location.href='/player/{{ p.player_id }}'"
             class="cursor-pointer bg-slate-900/50 backdrop-blur-xl
                    border border-white/5 rounded-2xl p-6 shadow-xl
                    hover:scale-[1.05] transition group text-center">

            <img src="/static/player_photos/{{ p.photo if p.photo else 'default_player.png' }}"
                 class="h-28 w-28 mx-auto rounded-xl object-cover
                        border-2 border-indigo-500
                        shadow-[0_0_15px_rgba(99,102,241,0.4)] mb-4">

            <h3 class="text-white font-bold text-lg">
                {{ p.player_name }}
            </h3>

            <p class="text-slate-400 text-sm mt-1">
                🎮 {{ p.cod_name }}
            </p>

            <p class="mt-3 text-sm text-slate-300">
                KD:
                <span class="font-bold text-indigo-400">
                    {{ "%.2f"|format(p.kd_ratio if p.kd_ratio else 0) }}
                </span>
            </p>
        </div>
        {% endfor %}

        {% if not players %}
        <div class="col-span-full text-center text-slate-500 py-20">
            No players found for this team.
        </div>
        {% endif %}

    </div>
</section>

<!-- FOOTER -->
<footer class="border-t border-white/5 bg-slate-950 py-10 text-center text-slate-500">
    <p>© 2025 COD Champions Cup — GKV</p>
</footer>

</body>
</html>
