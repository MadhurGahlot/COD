<nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
    <div class="container mx-auto px-4 h-20 flex items-center justify-between">
        <a href="/" class="flex items-center gap-3 group">
            <div
                class="w-10 h-10 bg-brand rounded-xl flex items-center justify-center font-display text-2xl font-bold shadow-lg shadow-brand/30 group-hover:scale-110 transition-transform text-white">
                C
            </div>
            <span class="font-display text-xl tracking-tight uppercase">Champions <span
                    class="text-brand">Cup</span></span>
        </a>

        <div class="hidden md:flex items-center gap-8">
            <a href="/" class="hover:text-brand transition-colors">Home</a>
            <a href="/teams" class="hover:text-brand transition-colors">Teams</a>
            <a href="/players" class="hover:text-brand transition-colors">Players</a>
            <a href="/leaderboard" class="hover:text-brand transition-colors">Points Table</a>
            <a href="/schedule" class="hover:text-brand transition-colors">Fixtures</a>

            <!-- Year Selector -->
            <form action="/set_year" method="POST" class="ml-2">
                <select name="year" onchange="this.form.submit()"
                    class="bg-slate-800 text-brand text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-700 outline-none focus:border-brand transition-all cursor-pointer hover:bg-slate-700">
                    {% for y in range(2024, now.year + 1) %}
                    <option value="{{ y }}" {% if session.selected_year|int==y %}selected{% endif %}>{{ y }} Season
                    </option>
                    {% endfor %}
                </select>
            </form>
        </div>

        <div class="flex items-center gap-4">
            {% if session.user_id %}
            <div class="flex items-center gap-4">
                {% if session.role == 'admin' %}
                <a href="/admin/dashboard"
                    class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm font-bold transition-all">Admin</a>
                {% else %}
                <a href="/player/me" class="text-slate-400 hover:text-white transition-colors">{{ session.username
                    }}</a>
                {% endif %}
                <a href="/logout"
                    class="bg-brand hover:bg-brand/90 px-4 py-2 rounded-lg text-sm font-bold transition-all shadow-lg shadow-brand/10">Logout</a>
            </div>
            {% else %}
            <a href="/login" class="hover:text-brand transition-colors font-bold">Login</a>
            <a href="/register"
                class="bg-brand hover:bg-brand/90 px-6 py-2 rounded-lg font-bold transition-all shadow-lg shadow-brand/10">Register</a>
            {% endif %}
        </div>
    </div>
</nav>
